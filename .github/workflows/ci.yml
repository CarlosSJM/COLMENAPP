name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: colmenapp
          POSTGRES_PASSWORD: colmenapp_test
          POSTGRES_DB: colmenapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run Prisma migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://colmenapp:colmenapp_test@localhost:5432/colmenapp_test
        run: npx prisma migrate deploy

      - name: Run unit tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://colmenapp:colmenapp_test@localhost:5432/colmenapp_test
          JWT_SECRET: test-secret-for-ci
        run: npx jest src/**/*.service.spec.ts --forceExit

      - name: Run e2e tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://colmenapp:colmenapp_test@localhost:5432/colmenapp_test
          JWT_SECRET: test-secret-for-ci
        run: npx jest --config test/jest-e2e.json --forceExit

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

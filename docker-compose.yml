version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: colmenapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: colmenapp
      POSTGRES_PASSWORD: colmenapp_dev
      POSTGRES_DB: colmenapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
